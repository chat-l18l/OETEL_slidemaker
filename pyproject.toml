[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slidesmith"
version = "0.1.0"
description = "Slides als code: educatieve presentaties, PDF's en video's uit tekstbestanden"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "pygments>=2.17",
    "jinja2>=3.1",
    "pillow>=10",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
slides = "slidesmith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slidesmith = ["static/**/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
