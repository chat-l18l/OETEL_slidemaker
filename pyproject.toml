[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slidesmith"
version = "0.1.0"
description = "Slides als code: educatieve presentaties, PDF's en video's uit tekstbestanden"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "pygments>=2.17",
    "jinja2>=3.1",
    "pillow>=10",
    "websockets>=13",
    "playwright>=1.45",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
slides = "slidesmith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slidesmith = ["static/**/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

# ---------------------------------------------------------------------------
# pixi: reproducible environment including the non-Python tools.
#   pixi install          -> environment from pixi.lock
#   pixi run setup        -> download the matching headless Chromium
#   pixi run slides ...   -> run the CLI
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = "3.12.*"
ffmpeg = ">=7"
graphviz = ">=12"
d2 = ">=0.7"
playwright = ">=1.45"

[tool.pixi.pypi-dependencies]
slidesmith = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = ">=8"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
setup = { cmd = "playwright install chromium-headless-shell", description = "Download headless Chromium voor PDF/video/Mermaid" }
test = { cmd = "pytest -q", description = "Draai de tests" }
check = { cmd = "slides check voorbeeld", description = "Controleer de voorbeeldcursus" }
serve = { cmd = "slides serve voorbeeld", description = "Serveer de voorbeeldcursus met live reload" }
